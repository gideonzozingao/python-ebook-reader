name: Release

# release.yml - builds Book Reader for Windows, Linux and macOS and publishes a GitHub release.
#
# Ways to publish:
#  1. Actions tab -> Release -> Run workflow: pick bump (patch/minor/major), channel
#     (stable/beta) and compiler. The version is bumped, committed, tagged, built and published.
#  2. Push a tag yourself (book_reader/__init__.py must already contain that version):
#        git tag v1.2.0 && git push origin v1.2.0
#  3. Rolling beta: every push to main (direct commit or merged PR) publishes the next beta
#     (1.2.0-beta.1, -beta.2, ...). Turn this off with the repository variable AUTO_BETA=false.
#
# Installed Windows apps read the update feed of their channel:
#     https://github.com/<owner>/<repo>/releases/download/update-feed/stable.json  (or beta.json)
# The "update-feed" release is created automatically; do not delete it.
#
# A release needs the Windows build to pass; Linux and macOS packages are attached when their
# builds pass too (otherwise the release is published without them, with a warning).
#
# Because the workflow commits the version bump to main, run "git pull" before working locally.
# If a run that bumped the version fails (Windows build or publishing), the rollback job deletes
# its tag and unpublished release and puts the previous version back, so a retry reuses the number.
# Optional signing: repository secrets WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta]
        default: stable
      compiler:
        description: "Build with (nuitka compiles to machine code and takes much longer)"
        type: choice
        options: [pyinstaller, nuitka]
        default: pyinstaller
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Run workflow -> the choice made there; pushes -> repository variable BUILDER, else pyinstaller
  BUILDER: ${{ inputs.compiler || vars.BUILDER || 'pyinstaller' }}

jobs:
  # ------------------------------------------------------------------------------- Version
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip ci]') &&
          (github.event_name != 'push' || github.ref_type == 'tag' || vars.AUTO_BETA != 'false') }}
    permissions:
      contents: write          # commits the version bump and pushes the tag
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      channel: ${{ steps.v.outputs.channel }}
      bumped: ${{ steps.v.outputs.bumped }}      # true when this run committed a bump + tag
      previous: ${{ steps.v.outputs.previous }}  # version before the bump (for the rollback job)
    steps:
      - uses: actions/checkout@v7
        with:
          # Branch tip (not the triggering SHA) so queued runs see the previous bump commit
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: v
        name: Bump, commit and tag (or check the pushed tag)
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          CHANNEL: ${{ inputs.channel || 'beta' }}     # push to main => rolling beta
        run: |
          set -euo pipefail
          previous="$(python scripts/bump_version.py --show)"
          bumped=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            code="$(python scripts/bump_version.py --show)"
            if [[ "$code" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ ($code) in book_reader/__init__.py"
              exit 1
            fi
          else
            version="$(python scripts/bump_version.py "$BUMP" "$CHANNEL")"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$version [skip ci]"
            git tag "v$version"
            git push origin "HEAD:$GITHUB_REF_NAME" "v$version"
            bumped=true
          fi
          if [[ "$version" == *-* ]]; then pre=true; channel=beta; else pre=false; channel=stable; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$pre"
            echo "channel=$channel"
            echo "bumped=$bumped"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (channel=$channel, prerelease=$pre, compiler=$BUILDER)"

  # ------------------------------------------------------------------------------- Windows
  windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build*.txt

      # constants.UPDATE_URL is empty in the source. Point this build at its channel's update
      # feed (or at the repository variable UPDATE_URL if you host updates elsewhere).
      - name: Point the app at the ${{ needs.prepare.outputs.channel }} update feed
        shell: pwsh
        env:
          UPDATE_URL: ${{ vars.UPDATE_URL || format('https://github.com/{0}/releases/download/update-feed/{1}.json', github.repository, needs.prepare.outputs.channel) }}
          CUSTOM_URL: ${{ vars.UPDATE_URL }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:REPO_PRIVATE -eq 'true' -and -not $env:CUSTOM_URL) {
            Write-Warning 'This repository is private, so the app could not read its releases anonymously. Automatic updates stay switched off in this build. Set the repository variable UPDATE_URL to a public HTTPS address to enable them.'
            exit 0
          }
          if ($env:UPDATE_URL -notmatch '^https://[^\s"''\\]+$') { throw "UPDATE_URL must be a plain https:// address, got: $env:UPDATE_URL" }
          $path = 'book_reader/constants.py'
          $src  = Get-Content -Raw $path
          $old  = 'os.environ.get("BOOK_READER_UPDATE_URL", "")'
          if (-not $src.Contains($old)) { throw "Could not find the UPDATE_URL default in $path" }
          $new  = 'os.environ.get("BOOK_READER_UPDATE_URL", "' + $env:UPDATE_URL + '")'
          Set-Content -Path $path -Value ($src.Replace($old, $new)) -NoNewline -Encoding utf8
          Write-Host "The app will look for updates at: $env:UPDATE_URL"

      # Optional. With no secrets the build is simply unsigned (bin\sign_file.bat skips signing).
      - name: Prepare code signing (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host 'No signing certificate configured: this build will be UNSIGNED.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "SIGN_METHOD=pfx"                 >> $env:GITHUB_ENV
          "SIGN_PFX=$pfx"                   >> $env:GITHUB_ENV
          "SIGN_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV
          Write-Host 'Signing is on: BookReader.exe, the installer and the uninstaller will be signed.'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if ($paths | Where-Object { Test-Path $_ }) { Write-Host 'Inno Setup already installed'; exit 0 }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }

      # bin/build.ps1 does the work: PyInstaller or Nuitka, signing, the program's --self-test, then
      # the Inno Setup installer and its .sha256. Nuitka uses the runner's Visual Studio compiler.
      - name: Build the program (${{ env.BUILDER }}) and the installer
        shell: pwsh
        run: ./bin/build.ps1 -Compiler $env:BUILDER -Python python

      # Waits with $p.WaitForExit(timeout), never Start-Process -Wait: -Wait also waits for every
      # process the installer starts (such as a relaunched BookReader), which can hang forever.
      - name: Smoke test - install silently, run the installed program's self-test
        timeout-minutes: 10
        shell: pwsh
        run: |
          function Wait-Exit($p, [int]$seconds, [string]$what) {
            if (-not $p.WaitForExit($seconds * 1000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$what did not finish within $seconds seconds"
            }
            $p.WaitForExit()          # makes ExitCode available
            return $p.ExitCode
          }
          $setup = (Resolve-Path "installer/BookReader-Setup-$env:VERSION.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP 'BookReaderTest'
          "SETUP_EXE=$setup" >> $env:GITHUB_ENV
          "TEST_DIR=$dir"    >> $env:GITHUB_ENV
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$dir" -PassThru
          $code = Wait-Exit $p 300 'The installer'
          if ($code -ne 0) { throw "The installer exited with code $code" }
          $exe = Join-Path $dir 'BookReader.exe'
          if (-not (Test-Path $exe)) { throw 'BookReader.exe was not installed' }
          $data = Join-Path $env:RUNNER_TEMP 'br-data'
          $env:EPUB_READER_HOME = $data
          $t = Start-Process $exe -ArgumentList '--self-test' -PassThru
          $code = Wait-Exit $t 180 'The self-test'
          Get-Content (Join-Path $data 'selftest.txt') -ErrorAction SilentlyContinue | Write-Host
          if ($code -ne 0) { throw 'The self-test of the installed program failed' }

      # Checks the installer.iss relaunch rule used by the in-app updater. Needs a desktop
      # session on the runner, hence continue-on-error; delete that line once you've seen it pass.
      - name: Smoke test - the updater's silent upgrade relaunches the app
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          function Stop-App { Get-Process BookReader -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2 }
          function Install([string[]]$switches) {
            # wait for the installer only (not for the app it may start), at most 5 minutes
            $p = Start-Process $env:SETUP_EXE -ArgumentList ($switches + "/DIR=$env:TEST_DIR") -PassThru
            if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Stop-App; throw 'The installer did not finish within 5 minutes' }
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { Stop-App; throw "The installer exited with code $($p.ExitCode)" }
          }
          function Wait-App([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              if (Get-Process BookReader -ErrorAction SilentlyContinue) { return $true }
              Start-Sleep -Milliseconds 500
            }
            return $false
          }
          try {
            Stop-App
            Install @('/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-')
            if (Wait-App 6) { throw 'A plain silent install started the app (it should not)' }
            # same switches as INSTALLER_ARGS in book_reader/services/updater.py
            Install @('/SILENT','/SP-','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/RELAUNCH=1')
            if (-not (Wait-App 40)) { throw 'The updater switches did not start the new version' }
            Write-Host 'OK: plain silent install leaves the app closed, /RELAUNCH=1 starts it.'
          } finally {
            Stop-App
          }

      - name: Remove the signing certificate from the runner
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: BookReader-Setup-${{ needs.prepare.outputs.version }}
          path: |
            installer/BookReader-Setup-${{ needs.prepare.outputs.version }}.exe
            installer/BookReader-Setup-${{ needs.prepare.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------- Linux
  linux:
    name: Build Linux package
    needs: prepare
    # Oldest Ubuntu runner on purpose: built against an older glibc, the program also runs on
    # newer distributions. If GitHub retires this image, switch to ubuntu-24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      QT_QPA_PLATFORM: offscreen   # run the self-tests without a screen
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Check that the build files are in the repository
        run: |
          missing=0
          for f in bin/build_exe.sh BookReader.spec requirements-build.txt requirements-build-nuitka.txt \
                   bin/package_linux.sh packaging/linux/install.sh packaging/linux/book-reader.desktop; do
            if [ ! -f "$f" ]; then echo "::error::Missing from the repository: $f"; missing=1; fi
          done
          if [ "$BUILDER" = "nuitka" ] && [ ! -f tools/build_nuitka.py ]; then
            echo "::error::Missing from the repository: tools/build_nuitka.py"; missing=1
          fi
          [ "$missing" = 0 ] || { echo "Commit and push the files above, then start a NEW run."; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build*.txt

      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3

      - name: Build the program (${{ env.BUILDER }} + self-test)
        run: bash bin/build_exe.sh

      - name: Make the .tar.gz package
        run: bash bin/package_linux.sh "$VERSION"

      - name: Smoke test - unpack, install, self-test, uninstall
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/br-linux"
          rm -rf "$T"; mkdir -p "$T/home"
          tar -xzf installer/BookReader-"$VERSION"-linux-*.tar.gz -C "$T"
          PKG="$(echo "$T"/BookReader-"$VERSION"-linux-*)"
          HOME="$T/home" XDG_DATA_HOME="$T/home/.local/share" bash "$PKG/install.sh"
          APP="$T/home/.local/share/BookReader"
          test -x "$APP/BookReader"
          test -f "$T/home/.local/share/applications/book-reader.desktop"
          EPUB_READER_HOME="$T/data" "$APP/BookReader" --self-test || { cat "$T/data/selftest.txt" 2>/dev/null; exit 1; }
          cat "$T/data/selftest.txt" 2>/dev/null || true
          HOME="$T/home" XDG_DATA_HOME="$T/home/.local/share" bash "$APP/uninstall.sh"
          test ! -e "$APP"
          echo "OK: install, self-test and uninstall all work."

      - uses: actions/upload-artifact@v7
        with:
          name: BookReader-${{ needs.prepare.outputs.version }}-linux
          path: installer/BookReader-${{ needs.prepare.outputs.version }}-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------- macOS
  macos:
    name: Build macOS disk image
    needs: prepare
    runs-on: macos-latest      # Apple Silicon (arm64)
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Check that the build files are in the repository
        run: |
          missing=0
          for f in bin/build_exe.sh BookReader.spec requirements-build.txt requirements-build-nuitka.txt \
                   bin/package_macos.sh; do
            if [ ! -f "$f" ]; then echo "::error::Missing from the repository: $f"; missing=1; fi
          done
          if [ "$BUILDER" = "nuitka" ] && [ ! -f tools/build_nuitka.py ]; then
            echo "::error::Missing from the repository: tools/build_nuitka.py"; missing=1
          fi
          [ "$missing" = 0 ] || { echo "Commit and push the files above, then start a NEW run."; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build*.txt

      - name: Build the program (${{ env.BUILDER }} + self-test)
        run: bash bin/build_exe.sh

      - name: Make the .dmg
        run: bash bin/package_macos.sh "$VERSION"

      - name: Smoke test - open the .dmg, copy the app out, self-test
        run: |
          set -euo pipefail
          DMG="$(ls installer/BookReader-"$VERSION"-macos-*.dmg)"
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          rm -rf "$RUNNER_TEMP/BookReader.app"
          cp -R "$MNT/BookReader.app" "$RUNNER_TEMP/"
          test -L "$MNT/Applications"
          hdiutil detach "$MNT"
          codesign --verify --deep --strict "$RUNNER_TEMP/BookReader.app"
          D="$RUNNER_TEMP/br-data"
          EPUB_READER_HOME="$D" QT_QPA_PLATFORM=offscreen \
            "$RUNNER_TEMP/BookReader.app/Contents/MacOS/BookReader" --self-test || { cat "$D/selftest.txt" 2>/dev/null; exit 1; }
          cat "$D/selftest.txt" 2>/dev/null || true
          echo "OK: the app from the disk image runs."

      - uses: actions/upload-artifact@v7
        with:
          name: BookReader-${{ needs.prepare.outputs.version }}-macos
          path: installer/BookReader-${{ needs.prepare.outputs.version }}-macos-*.dmg
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------- Publish
  publish:
    name: Publish GitHub release
    needs: [prepare, windows, linux, macos]
    if: ${{ always() && needs.prepare.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download the Windows, Linux and macOS builds
        uses: actions/download-artifact@v8
        with:
          pattern: BookReader-*
          path: installer
          merge-multiple: true

      - name: List what will be published
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          ls -lh installer
          [ "$LINUX_RESULT" = "success" ] || echo "::warning::The Linux build did not pass ($LINUX_RESULT); this release has no Linux package."
          [ "$MACOS_RESULT" = "success" ] || echo "::warning::The macOS build did not pass ($MACOS_RESULT); this release has no macOS disk image."

      # GitHub writes the "what's new" list from the commits and pull requests since the last tag.
      - name: Write the release notes
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md || true
          [ -s notes.md ] || echo "Book Reader $VERSION" > notes.md

      # latest.json: the update manifest the Windows app reads (+ the installer's .sha256).
      - name: Write the update manifest
        run: |
          python3 tools/make_manifest.py "installer/BookReader-Setup-$VERSION.exe" \
            --url "https://github.com/$GH_REPO/releases/download/$TAG/BookReader-Setup-$VERSION.exe" \
            --page "https://github.com/$GH_REPO/releases/tag/$TAG" \
            --notes @notes.md
          cat installer/latest.json

      - name: Write checksums for the Linux and macOS files
        run: |
          shopt -s nullglob
          cd installer
          for f in BookReader-"$VERSION"-linux-*.tar.gz BookReader-"$VERSION"-macos-*.dmg; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      # Install hints for the release page only, listing what is actually attached.
      - name: Add download notes to the release page
        run: |
          shopt -s nullglob
          linux=(installer/BookReader-"$VERSION"-linux-*.tar.gz)
          macos=(installer/BookReader-"$VERSION"-macos-*.dmg)
          {
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Beta.** Installs of this version are offered the next betas and stable releases."
              echo
            fi
            echo "### Downloads"
            echo "- **Windows:** \`BookReader-Setup-$VERSION.exe\` - run it and follow the steps. Installed copies update themselves."
            if [ ${#linux[@]} -gt 0 ]; then
              echo "- **Linux (x86_64):** \`$(basename "${linux[0]}")\` - unpack it, then run \`./install.sh\` inside the folder (no root needed). \`~/.local/share/BookReader/uninstall.sh\` removes it. If it does not start: \`sudo apt install libxcb-cursor0\`."
            fi
            if [ ${#macos[@]} -gt 0 ]; then
              echo "- **macOS (Apple Silicon):** \`$(basename "${macos[0]}")\` - open it and drag BookReader to Applications. The app is not notarized by Apple yet, so the first time, right-click the app and choose **Open**."
            fi
            echo
            echo "Your books and notes are kept in your home folder (\`.epub_reader\`) and survive updates and uninstalls."
          } >> notes.md
          cat notes.md

      # Created as a draft, filled, then published, so a release is never visible without its
      # files. Only stable releases become "Latest" (old installs still read latest.json there).
      - name: Publish the release
        run: |
          shopt -s nullglob
          files=(installer/BookReader-Setup-"$VERSION".exe installer/latest.json \
                 installer/BookReader-"$VERSION"-linux-*.tar.gz installer/BookReader-"$VERSION"-macos-*.dmg \
                 installer/*.sha256)
          printf 'Uploading %s\n' "${files[@]}"
          pre=(); [ "$PRERELEASE" = "true" ] && pre=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag "${pre[@]}" \
              --title "Book Reader $VERSION" --notes-file notes.md
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

      # The app polls releases/download/update-feed/<channel>.json (fixed address, no API limits).
      - name: Update the in-app update feed
        run: |
          set -euo pipefail
          mkdir -p feed
          gh release view update-feed >/dev/null 2>&1 || gh release create update-feed \
            --prerelease --latest=false --title "Update feed (used by the app, do not delete)" \
            --notes "Machine-readable update manifests polled by installed copies of Book Reader."
          gh release download update-feed --dir feed --pattern "*.json" || true
          python3 tools/update_feed.py --manifest installer/latest.json --version "$VERSION" \
            --channel "$CHANNEL" --feed feed
          gh release upload update-feed feed/*.json --clobber

  # ------------------------------------------------------------------------------- README stats
  # Rewrites the "Release stats" table in README.md (latest versions, successful runs,
  # downloads). The commit only touches README.md and says [skip ci], so it starts no build.
  stats:
    name: Update README stats
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rewrite the stats block
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/update_readme_stats.py README.md

      - name: Commit the new stats
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then echo "No change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README release stats [skip ci]" -- README.md
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            sleep 5
          done
          echo "::warning::Could not push the README stats (main kept moving); they will update after the next release."

  # ------------------------------------------------------------------------------- Rollback
  # A run that bumped the version and then failed (Windows build, or publishing) would leave
  # its tag and version bump behind, and the next run would skip to a higher number. This job
  # deletes that run's tag and unpublished draft release and puts the previous version back on
  # main, so a retry gets the same version number. It never touches a release that went live,
  # and runs that were started by pushing a tag yourself are left alone.
  rollback:
    name: Undo the version bump of this failed run
    needs: [prepare, windows, linux, macos, publish]
    if: >-
      ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.bumped == 'true' &&
          (needs.windows.result != 'success' || needs.publish.result == 'failure' || needs.publish.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Delete the unpublished release and the tag
        id: tag
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::warning::Release $TAG is already published, so nothing is rolled back. Fix the problem and run the workflow again; it will make the next version."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release delete "$TAG" --yes
            echo "Deleted the draft release $TAG"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git push origin ":refs/tags/$TAG"
            echo "Deleted the tag $TAG"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Put version ${{ needs.prepare.outputs.previous }} back
        if: steps.tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH"
            current="$(python3 scripts/bump_version.py --show)"
            if [ "$current" != "$VERSION" ]; then
              echo "::warning::$BRANCH is now at version $current (not $VERSION), so the version is left as it is."
              exit 0
            fi
            python3 scripts/bump_version.py --set "$PREVIOUS"
            git commit -am "Roll back to $PREVIOUS after failed release $TAG [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "Version is back at $PREVIOUS; the next run will release $VERSION again."
              exit 0
            fi
            git reset --hard "origin/$BRANCH"
            sleep 5
          done
          echo "::error::Could not push the version rollback. Set __version__ back to $PREVIOUS by hand."
          exit 1