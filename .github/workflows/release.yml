# Builds Book Reader for Windows, Linux and macOS, tests each build, and publishes them as one
# GitHub Release together with the files the Windows auto-updater reads (latest.json + .sha256).
#
#   Windows: build_installer.bat -> build_exe.bat -> PyInstaller + Inno Setup  -> Setup .exe
#   Linux:   build_exe.sh + tools/package_linux.sh                             -> .tar.gz
#   macOS:   build_exe.sh + tools/package_macos.sh                             -> .dmg
#
#   Release:      bump __version__ in book_reader/__init__.py, commit, then
#                     git tag v1.2.0 && git push origin v1.2.0
#   Test build:   Actions tab -> "Release" -> Run workflow  (builds all three and keeps them as
#                 downloadable artifacts, publishes nothing)
#
# Build tool for all three platforms: PyInstaller (default, bundles Python bytecode) or Nuitka
# (compiles the code to C and then to machine code). Pick it in "Run workflow", or for tag
# releases set the repository variable BUILDER to "nuitka" (Settings -> Secrets and variables ->
# Actions -> Variables). build_exe.bat and build_exe.sh read BUILDER from the environment.
#
# One-time setup and optional code signing: see BUILD.md, "Automated releases (GitHub Actions)".
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      builder:
        description: "Build tool (nuitka compiles to machine code and takes much longer)"
        type: choice
        options: [pyinstaller, nuitka]
        default: pyinstaller

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the build jobs (which run pip packages and your build scripts) can only read.
# Only the small publish job at the bottom gets write access.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Run workflow -> the choice made there; tag push -> repository variable BUILDER, else pyinstaller
  BUILDER: ${{ inputs.builder || vars.BUILDER || 'pyinstaller' }}

jobs:
  # ---------------------------------------------------------------------------------- Windows
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90           # Nuitka compiles take much longer than PyInstaller builds
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The app, the installer file name and the updater all rely on this one number.
      - name: Read the version (and make sure the tag matches it)
        id: ver
        shell: pwsh
        run: |
          $text = Get-Content -Raw book_reader/__init__.py
          $m = [regex]::Match($text, '__version__\s*=\s*"(\d+(?:\.\d+){1,3})"')
          if (-not $m.Success) {
            throw 'Could not read a plain numeric __version__ (like "1.2.0") from book_reader/__init__.py'
          }
          $ver = $m.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "The tag $($env:GITHUB_REF_NAME) does not match __version__ $ver. Bump book_reader/__init__.py, or tag v$ver."
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building Book Reader $ver"

      # constants.UPDATE_URL is empty in the source. For the Windows release build, point it at this
      # repository's latest release (or at the repository variable UPDATE_URL if you host updates
      # elsewhere). Only the build workspace is changed; nothing is committed.
      # (The Linux and macOS builds leave it empty: the updater installs Windows setup files.)
      - name: Point the app at this repository's updates
        shell: pwsh
        env:
          UPDATE_URL: ${{ vars.UPDATE_URL || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
          CUSTOM_URL: ${{ vars.UPDATE_URL }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:REPO_PRIVATE -eq 'true' -and -not $env:CUSTOM_URL) {
            Write-Warning 'This repository is private, so the app could not read its releases anonymously. Automatic updates stay switched off in this build. Set the repository variable UPDATE_URL to a public HTTPS address to enable them.'
            exit 0
          }
          if ($env:UPDATE_URL -notmatch '^https://[^\s"''\\]+$') { throw "UPDATE_URL must be a plain https:// address, got: $env:UPDATE_URL" }
          $path = 'book_reader/constants.py'
          $src  = Get-Content -Raw $path
          $old  = 'os.environ.get("BOOK_READER_UPDATE_URL", "")'
          if (-not $src.Contains($old)) { throw "Could not find the UPDATE_URL default in $path" }
          $new  = 'os.environ.get("BOOK_READER_UPDATE_URL", "' + $env:UPDATE_URL + '")'
          Set-Content -Path $path -Value ($src.Replace($old, $new)) -NoNewline -Encoding utf8
          Write-Host "The app will look for updates at: $env:UPDATE_URL"

      # build_exe.bat uses C:\venv\epub when it exists, so creating it here pins the Python version
      # instead of letting the script pick whichever Python it finds first.
      - name: Create the build environment
        shell: cmd
        run: python -m venv C:\venv\epub

      # Optional. With no secrets the build is simply unsigned (sign_file.bat skips signing).
      - name: Prepare code signing (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host 'No signing certificate configured: this build will be UNSIGNED.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          # sign_file.bat and build_installer.bat read these (same names as sign_config.example.bat)
          "SIGN_METHOD=pfx"            >> $env:GITHUB_ENV
          "SIGN_PFX=$pfx"              >> $env:GITHUB_ENV
          "SIGN_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV
          Write-Host 'Signing is on: BookReader.exe, the installer and the uninstaller will be signed.'

      - name: Make sure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) { Write-Host "Inno Setup found: $found"; exit 0 }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }

      # Your own script does the work: PyInstaller or Nuitka build (from BUILDER), signing, the
      # program's --self-test, then the Inno Setup installer. /nopause = do not wait for a key.
      # Nuitka uses the Visual Studio C compiler that is preinstalled on GitHub's Windows runners.
      - name: Build the program (${{ env.BUILDER }}) and the installer
        shell: cmd
        run: |
          call build_installer.bat ${{ steps.ver.outputs.version }} /nopause
          if errorlevel 1 exit /b 1

      - name: Check the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $f = "installer/BookReader-Setup-$env:VERSION.exe"
          if (-not (Test-Path $f)) { throw "$f was not produced" }
          $item = Get-Item $f
          Write-Host ("{0}  {1:N1} MB" -f $item.Name, ($item.Length / 1MB))
          if ($env:SIGN_METHOD) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "Signature status: $($sig.Status)"
            if (-not $sig.SignerCertificate) { throw 'Signing was configured but the installer is not signed' }
          }
          "SETUP_EXE=$((Resolve-Path $f).Path)"                      >> $env:GITHUB_ENV
          "TEST_DIR=$(Join-Path $env:RUNNER_TEMP 'BookReaderTest')"  >> $env:GITHUB_ENV

      - name: Smoke test - install silently, run the installed program's self-test
        shell: pwsh
        run: |
          $p = Start-Process $env:SETUP_EXE -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$env:TEST_DIR" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with code $($p.ExitCode)" }
          $exe = Join-Path $env:TEST_DIR 'BookReader.exe'
          if (-not (Test-Path $exe)) { throw 'BookReader.exe was not installed' }
          $data = Join-Path $env:RUNNER_TEMP 'br-data'
          $env:EPUB_READER_HOME = $data
          $t = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content (Join-Path $data 'selftest.txt') -ErrorAction SilentlyContinue | Write-Host
          if ($t.ExitCode -ne 0) { throw 'The self-test of the installed program failed' }

      # Checks the "installer.iss" relaunch rule used by the in-app updater: a plain silent install
      # must NOT start the app, the updater's switches (/RELAUNCH=1) must. This runs a real
      # upgrade-over-the-top, so it is the closest thing to what users will do.
      # continue-on-error: it needs a desktop session on the runner; once you have seen it pass,
      # delete that line to make it a hard check.
      - name: Smoke test - the updater's silent upgrade relaunches the app
        continue-on-error: true
        shell: pwsh
        run: |
          function Stop-App { Get-Process BookReader -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2 }
          Stop-App
          $p = Start-Process $env:SETUP_EXE -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$env:TEST_DIR" -Wait -PassThru
          Start-Sleep 6
          if (Get-Process BookReader -ErrorAction SilentlyContinue) { Stop-App; throw 'A plain silent install started the app (it should not)' }
          # same switches as INSTALLER_ARGS in book_reader/services/updater.py
          $p = Start-Process $env:SETUP_EXE -ArgumentList '/SILENT','/SP-','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/RELAUNCH=1',"/DIR=$env:TEST_DIR" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The upgrade exited with code $($p.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(40)
          while (-not (Get-Process BookReader -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          $running = [bool](Get-Process BookReader -ErrorAction SilentlyContinue)
          Stop-App
          if (-not $running) { throw 'The updater switches did not start the new version' }
          Write-Host 'OK: plain silent install leaves the app closed, /RELAUNCH=1 starts it.'

      - name: Remove the signing certificate from the runner
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: BookReader-Setup-${{ steps.ver.outputs.version }}
          path: installer/BookReader-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------------ Linux
  build-linux:
    name: Build Linux package
    # Built on the oldest Ubuntu runner on purpose: a program built against an older system
    # library (glibc) also runs on newer distributions, but not the other way round.
    # If GitHub retires this runner image, switch to ubuntu-24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 90           # Nuitka compiles take much longer than PyInstaller builds
    env:
      QT_QPA_PLATFORM: offscreen   # run the self-tests without a screen

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Read the version (and make sure the tag matches it)
        id: ver
        run: bash tools/read_version.sh

      # System libraries Qt needs to start (offscreen) for the self-test.
      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3

      - name: Build the program (${{ env.BUILDER }} + self-test)
        run: bash build_exe.sh

      - name: Make the .tar.gz package
        run: bash tools/package_linux.sh "${{ steps.ver.outputs.version }}"

      # Unpacks the download, runs install.sh into a scratch home folder, runs the installed
      # program's self-test, then checks that uninstalling cleans up.
      - name: Smoke test - unpack, install, self-test, uninstall
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/br-linux"
          rm -rf "$T"; mkdir -p "$T/home"
          tar -xzf installer/BookReader-$VERSION-linux-*.tar.gz -C "$T"
          PKG="$(echo "$T"/BookReader-$VERSION-linux-*)"
          HOME="$T/home" XDG_DATA_HOME="$T/home/.local/share" bash "$PKG/install.sh"
          APP="$T/home/.local/share/BookReader"
          test -x "$APP/BookReader"
          test -f "$T/home/.local/share/applications/book-reader.desktop"
          EPUB_READER_HOME="$T/data" "$APP/BookReader" --self-test || { cat "$T/data/selftest.txt" 2>/dev/null; exit 1; }
          cat "$T/data/selftest.txt" 2>/dev/null || true
          HOME="$T/home" XDG_DATA_HOME="$T/home/.local/share" bash "$APP/uninstall.sh"
          test ! -e "$APP"
          echo "OK: install, self-test and uninstall all work."

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: BookReader-${{ steps.ver.outputs.version }}-linux
          path: installer/BookReader-${{ steps.ver.outputs.version }}-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------------ macOS
  build-macos:
    name: Build macOS disk image
    # macos-latest runs on Apple Silicon, so this build is for M1/M2/M3/... Macs (arm64).
    runs-on: macos-latest
    timeout-minutes: 90           # Nuitka compiles take much longer than PyInstaller builds

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Read the version (and make sure the tag matches it)
        id: ver
        run: bash tools/read_version.sh

      - name: Build the program (${{ env.BUILDER }} + self-test)
        run: bash build_exe.sh

      - name: Make the .dmg
        run: bash tools/package_macos.sh "${{ steps.ver.outputs.version }}"

      # Opens the disk image the way a user would, copies the app out, runs its self-test.
      - name: Smoke test - open the .dmg, copy the app out, self-test
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DMG="$(ls installer/BookReader-$VERSION-macos-*.dmg)"
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          rm -rf "$RUNNER_TEMP/BookReader.app"
          cp -R "$MNT/BookReader.app" "$RUNNER_TEMP/"
          test -L "$MNT/Applications"
          hdiutil detach "$MNT"
          codesign --verify --deep --strict "$RUNNER_TEMP/BookReader.app"
          D="$RUNNER_TEMP/br-data"
          EPUB_READER_HOME="$D" QT_QPA_PLATFORM=offscreen \
            "$RUNNER_TEMP/BookReader.app/Contents/MacOS/BookReader" --self-test || { cat "$D/selftest.txt" 2>/dev/null; exit 1; }
          cat "$D/selftest.txt" 2>/dev/null || true
          echo "OK: the app from the disk image runs."

      - name: Keep the disk image
        uses: actions/upload-artifact@v7
        with:
          name: BookReader-${{ steps.ver.outputs.version }}-macos
          path: installer/BookReader-${{ steps.ver.outputs.version }}-macos-*.dmg
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------------------ Publish
  # Only for tags, and only when all three builds passed. Needs no Windows and no third-party
  # code: it takes the files built above, writes checksums and the update manifest, and
  # publishes the release.
  release:
    name: Publish GitHub release
    needs: [build, build-linux, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the Windows, Linux and macOS builds
        uses: actions/download-artifact@v8
        with:
          pattern: BookReader-*
          path: installer
          merge-multiple: true

      - name: List what will be published
        run: ls -lh installer

      # GitHub writes the "what's new" list from the commits and pull requests since the last tag.
      # The same text goes on the release page and into the update dialog inside the app.
      - name: Write the release notes
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md || true
          [ -s notes.md ] || echo "Book Reader $VERSION" > notes.md

      # latest.json (what the Windows app's updater reads) + BookReader-Setup-x.y.z.exe.sha256.
      # make_manifest.py also refuses to continue if the installer's version != __version__.
      - name: Write the checksum and update manifest
        run: |
          python3 tools/make_manifest.py "installer/BookReader-Setup-$VERSION.exe" \
            --url "https://github.com/$GH_REPO/releases/download/$TAG/BookReader-Setup-$VERSION.exe" \
            --page "https://github.com/$GH_REPO/releases/tag/$TAG" \
            --notes @notes.md
          cat installer/latest.json

      - name: Write checksums for the Linux and macOS files
        run: |
          cd installer
          for f in BookReader-"$VERSION"-linux-*.tar.gz BookReader-"$VERSION"-macos-*.dmg; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      # Install hints for the release page only (latest.json above already has the plain notes,
      # so the Windows update dialog does not show them).
      - name: Add download notes to the release page
        run: |
          cat >> notes.md <<'EOF'

          ### Downloads
          - **Windows:** `BookReader-Setup-<version>.exe` - run it and follow the steps.
          - **Linux (x86_64):** `BookReader-<version>-linux-x86_64.tar.gz` - unpack it, then run `./install.sh` inside the folder (no root needed). `~/.local/share/BookReader/uninstall.sh` removes it.
          - **macOS (Apple Silicon):** `BookReader-<version>-macos-arm64.dmg` - open it and drag Book Reader to Applications. The app is not notarized by Apple yet, so the first time, right-click the app and choose **Open**.

          Your books and notes are kept in your home folder (`.epub_reader`) and survive updates and uninstalls.
          EOF

      # Created as a draft, filled, then published, so the "latest release" address never points
      # at a release that is still missing its files.
      - name: Publish the release
        run: |
          shopt -s nullglob
          files=(installer/BookReader-Setup-"$VERSION".exe installer/latest.json \
                 installer/BookReader-"$VERSION"-linux-*.tar.gz installer/BookReader-"$VERSION"-macos-*.dmg \
                 installer/*.sha256)
          printf 'Uploading %s\n' "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "Book Reader $VERSION" --notes-file notes.md
          fi
          gh release edit "$TAG" --draft=false --latest